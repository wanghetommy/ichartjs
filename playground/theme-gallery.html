<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iChart.js 2.0 Theme Gallery</title><link rel="stylesheet" href="./shared.css"><style>.swatches{display:flex;gap:6px;flex-wrap:wrap}.swatch{width:34px;height:34px;border-radius:8px;border:1px solid #0002}.theme-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.theme-meta div{padding:10px;border:1px solid var(--line);border-radius:10px}.theme-meta strong{display:block;font-size:12px;color:var(--muted)}.export-row{display:flex;gap:6px;flex-wrap:wrap}.export-row button{font:12px system-ui;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--text)}.export-row button:hover{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}</style></head>
<body><main class="shell"><header class="topbar"><div><h1>主题与内置样式库</h1><p>验收自动场景匹配、明暗模式、视觉预设、语义配色、对比度诊断与不重建图表的实时切换。</p></div><div id="nav"></div></header>
<section class="toolbar" aria-label="Theme controls"><div class="field"><label for="mode">Mode</label><select id="mode"><option>auto</option><option>light</option><option>dark</option><option>contrast</option></select></div><div class="field"><label for="preset">Preset</label><select id="preset"><option>auto</option><option>analysis</option><option>dashboard</option><option>report</option><option>presentation</option><option>project</option><option>diagram</option></select></div><div class="field"><label for="palette">Palette</label><select id="palette"><option>auto</option><option>categorical</option><option>sequential</option><option>diverging</option><option>status</option></select></div><label class="field" style="gap:6px;white-space:nowrap"><input type="checkbox" id="globalBranding" checked style="width:auto;accent-color:#2563eb"><span>显示品牌署名</span></label><button id="reset" type="button">恢复自动</button><span id="status" class="status">initializing…</span></section>
<section class="panel stack"><div class="theme-meta" id="themeMeta"></div><div><h2 id="paletteTitle">当前配色</h2><div class="swatches" id="swatches"></div></div></section>
<section class="grid" id="gallery" style="margin-top:16px"></section><section class="panel" style="margin-top:16px"><details><summary>解析结果与对比度诊断</summary><pre id="output">waiting…</pre></details></section></main>
<script type="module">
import { createChart, validateThemeContrast } from './runtime.mjs';
import { galleryCases } from './gallery-cases.mjs';
import { json, pageNav, queryOptions, setStatus } from './playground.mjs';
document.querySelector('#nav').innerHTML=pageNav('theme-gallery.html');
const ids=['line','heatmap','gantt','flow'],controls={mode:document.querySelector('#mode'),preset:document.querySelector('#preset'),palette:document.querySelector('#palette'),globalBranding:document.querySelector('#globalBranding')},charts=[];
const query=queryOptions(['theme','preset','palette']);if(query.values.theme)controls.mode.value=query.values.theme;if(query.values.preset)controls.preset.value=query.values.preset;if(query.values.palette)controls.palette.value=query.values.palette;
const request=()=>({mode:controls.mode.value,preset:controls.preset.value,palette:controls.palette.value});
const globalBranding=()=>Boolean(controls.globalBranding.checked);
function renderDiagnostics(){const theme=charts[0]?.getTheme();if(!theme)return;document.querySelector('#themeMeta').innerHTML=`<div><strong>Name</strong>${theme.name}</div><div><strong>Mode</strong>${theme.mode} → ${theme.resolvedMode}</div><div><strong>Preset</strong>${theme.preset}</div><div><strong>Palette</strong>${theme.palette}</div>`;document.querySelector('#paletteTitle').textContent=`当前配色：${theme.palette}`;document.querySelector('#swatches').innerHTML=theme.colors.map(color=>`<span class="swatch" style="background:${color}" title="${color}"></span>`).join('');const diagnostics=validateThemeContrast(theme);document.querySelector('#output').textContent=json({request:request(),resolved:{name:theme.name,mode:theme.mode,resolvedMode:theme.resolvedMode,preset:theme.preset,palette:theme.palette,typography:theme.typography,layout:theme.layout,marks:theme.marks},reasons:theme.reasons,diagnostics,branding:{enabled:globalBranding(),signature:charts[0]?.getState?.()?.branding?.signature||'Powered by iChart.js'}});setStatus(document.querySelector('#status'),diagnostics.length?'warning':'ready',diagnostics.length?`${diagnostics.length} contrast warnings`:'contrast checks pass');}
function mount(){const gallery=document.querySelector('#gallery');ids.forEach(id=>{const item=galleryCases.find(entry=>entry.id===id),article=document.createElement('article');article.className='card';article.innerHTML=`<div class="row"><h2>${item.name}</h2><span class="badge">${item.category}</span></div><div class="chart" id="theme-${id}"></div><div class="row" style="justify-content:space-between"><div class="export-row" id="export-theme-${id}"><button type="button" data-export="png">导出 PNG</button><button type="button" data-export="svg">导出 SVG</button><button type="button" data-export="json">导出 JSON</button></div><div class="row" style="gap:10px"><label style="font:12px system-ui;color:#475569;display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-branding checked style="width:auto;accent-color:#2563eb">署名</label><p class="muted" data-style style="margin:0">resolving…</p></div></div>`;gallery.appendChild(article);const chart=createChart({...item.spec,container:`#theme-${id}`,renderer:'svg',theme:request(),width:560,height:300,branding:{enabled:globalBranding()},accessibility:{enabled:true}});charts.push(chart);article.querySelector('[data-style]').textContent=`${chart.getTheme().name} · ${chart.getTheme().palette}`;article.querySelector('[data-branding]').onchange=event=>chart.update({branding:{enabled:event.target.checked}});article.querySelector(`#export-theme-${id}`).onclick=event=>{const tgt=event.target.closest('[data-export]');if(!tgt)return;const type=tgt.dataset.export;if(type==='png'){chart.downloadPNG?.();}else if(type==='svg'){chart.downloadSVG?.();}else if(type==='json'){chart.downloadJSON?.();}};});renderDiagnostics();}
function switchTheme(){charts.forEach((chart,index)=>{chart.setTheme(request());chart.update({branding:{enabled:globalBranding()}});document.querySelectorAll('[data-style]')[index].textContent=`${chart.getTheme().name} · ${chart.getTheme().palette}`;document.querySelectorAll('[data-branding]')[index].checked=globalBranding();});renderDiagnostics();}
Object.values(controls).forEach(control=>control.addEventListener('change',switchTheme));document.querySelector('#reset').onclick=()=>{controls.mode.value='auto';controls.preset.value='auto';controls.palette.value='auto';controls.globalBranding.checked=true;switchTheme();};mount();
</script></body></html>
