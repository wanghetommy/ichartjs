<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iChart.js 2.0 Complete Gallery</title><link rel="stylesheet" href="./shared.css"><style>#gallery{--gallery-viewport-width:560px;--gallery-card-width:594px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start}#gallery .card{width:min(100%,var(--gallery-card-width));flex:0 1 var(--gallery-card-width)}#gallery .chart{width:min(100%,var(--gallery-viewport-width));margin-inline:auto}#dialogChart{height:min(70vh,650px);border:0;background:transparent;overflow:auto}#dialogChart>.chart{width:100%;height:100%!important;min-width:var(--preview-min-width,0px);min-height:var(--preview-min-height,0px);margin:0}</style></head>
<body><main class="shell"><header class="topbar"><div><h1>完整图表 Gallery</h1><p>18 类公共图表代表性样例与 Soft 流程图样式示例，用于统一视觉冒烟、能力检查与 Spec/诊断。默认保持静态；缩放、平移和编辑仅在专用交互页面显式开启。按能力拆分入口请查看 <a href="./profile-loading.html">按需加载示例</a>。</p></div><div id="nav"></div></header>
<section class="toolbar" aria-label="Gallery controls"><div class="field"><label for="search">搜索</label><input id="search" placeholder="名称或 type"></div><div class="field"><label for="category">分类</label><select id="category"><option value="all">全部</option><option value="basic">基础</option><option value="statistical">分析</option><option value="project">项目</option><option value="diagram">流程</option></select></div><div class="field"><label for="renderer">Renderer</label><select id="renderer"><option value="default">案例默认</option><option value="svg">SVG</option><option value="canvas">Canvas</option></select></div><div class="field"><label for="theme">Mode</label><select id="theme"><option>auto</option><option>light</option><option>dark</option><option>contrast</option></select></div><div class="field"><label for="preset">Preset</label><select id="preset"><option>auto</option><option>analysis</option><option>dashboard</option><option>report</option><option>presentation</option><option>project</option><option>diagram</option></select></div><div class="field"><label for="palette">Palette</label><select id="palette"><option>auto</option><option>categorical</option><option>sequential</option><option>diverging</option><option>status</option><option>soft</option></select></div><div class="field"><label for="size">图表宽度</label><select id="size" title="模拟每张图表的容器宽度"><option value="560">560 px · 默认</option><option value="390">390 px · 窄屏</option><option value="768">768 px · 宽屏</option></select></div><label class="field" style="gap:6px;white-space:nowrap"><input type="checkbox" id="globalBranding" checked style="width:auto;accent-color:#2563eb"><span>显示品牌署名</span></label><button id="reset" type="button">重置</button><span id="count" class="status">initializing…</span></section>
<section class="grid" id="gallery"></section>
<section class="panel" style="margin-top:18px"><div class="row"><div><h2>逐图表能力矩阵</h2><p class="muted">能力来自公开的 <code>getCapabilities().charts</code>，必须与 runtime 实际行为一致。</p></div><button id="downloadMatrix">下载 JSON</button></div><div class="table-wrap"><table id="matrix"><thead><tr><th>Type</th><th>Family</th><th>Required</th><th>Interactions</th><th>Supported features</th><th>Not applicable</th></tr></thead><tbody></tbody></table></div></section></main>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-label="图表放大预览"><div class="dialog-card"><div class="dialog-head"><strong id="dialogTitle">Preview</strong><button id="dialogClose">关闭（Esc）</button></div><div class="dialog-body"><div id="dialogChart" class="chart"></div><pre id="dialogOutput"></pre></div></div></div>
<script type="module">
import { createChart, createPreferencesStore, getCapabilities, mountChartSettings } from './runtime.mjs';
import { galleryCases } from './gallery-cases.mjs';
import { createSoftFlow } from './diagram-visuals.mjs';
import { downloadJSON, json, pageNav, queryOptions, setStatus } from './playground.mjs';
document.querySelector('#nav').innerHTML=pageNav('project-gallery.html');
const capabilities=getCapabilities(),preferenceStore=createPreferencesStore({storage:'localStorage',storageKey:'ichartjs:playground:gallery-preferences'}),instances=new Map(),settingsInstances=new Map(),controls={search:document.querySelector('#search'),category:document.querySelector('#category'),renderer:document.querySelector('#renderer'),theme:document.querySelector('#theme'),preset:document.querySelector('#preset'),palette:document.querySelector('#palette'),size:document.querySelector('#size'),globalBranding:document.querySelector('#globalBranding')};
const query=queryOptions(['renderer','theme','preset','palette','size','case']);if(query.values.renderer)controls.renderer.value=query.values.renderer;if(query.values.theme)controls.theme.value=query.values.theme;if(query.values.preset)controls.preset.value=query.values.preset;if(query.values.palette)controls.palette.value=query.values.palette;if(query.values.size)controls.size.value=query.values.size;if(query.values.case)controls.search.value=query.values.case;
const themeRequest=(base={})=>({mode:controls.theme.value,preset:controls.preset.value,palette:controls.palette.value==='auto'?base?.palette||'auto':controls.palette.value});
const galleryThemePreference=()=>({theme:Object.fromEntries([['mode','theme'],['preset','preset'],['palette','palette']].map(([key,controlKey])=>[key,controls[controlKey].value==='auto'?null:controls[controlKey].value]))});
const syncGalleryTheme=()=>{const preferences=galleryThemePreference();preferenceStore.setGlobal(preferences,{source:'gallery'});selectedCases().forEach(item=>preferenceStore.setChart(item.id,preferences,{source:'gallery'}));};
['theme','preset','palette'].forEach(key=>controls[key].addEventListener('change',syncGalleryTheme));
const globalBrandingEnabled=()=>Boolean(controls.globalBranding.checked);
const cardBrandingEnabled=article=>{if(article.dataset.brandingOverride==='on')return true;if(article.dataset.brandingOverride==='off')return false;return globalBrandingEnabled();};
function selectedCases(){const term=controls.search.value.trim().toLowerCase(),category=controls.category.value;return galleryCases.filter(item=>(category==='all'||item.category===category)&&(!term||`${item.name} ${item.id} ${item.spec.type}`.toLowerCase().includes(term))).map(item=>item.id==='flow-soft'?{...item,spec:createSoftFlow(Number(controls.size.value))}:item);}
function clear(){settingsInstances.forEach(controller=>controller.destroy?.());settingsInstances.clear();instances.forEach(chart=>chart.destroy());instances.clear();document.querySelector('#gallery').replaceChildren();}
let activePreview=null;
const computePreviewSize=()=>{
  const holder=document.querySelector('#dialogChart'),host=holder.querySelector('.chart')||holder,style=getComputedStyle(host);
  return {width:Math.max(1,Math.round(host.clientWidth-(parseFloat(style.paddingLeft)||0)-(parseFloat(style.paddingRight)||0))),height:Math.max(1,Math.round(host.clientHeight-(parseFloat(style.paddingTop)||0)-(parseFloat(style.paddingBottom)||0)))};
};
const previewDiagramView=(item,width,height,baseWidth,baseHeight)=>{
  if(item.spec.diagram?.layout!=='manual')return null;
  const scale=Math.max(0.25,Math.min(8,width/Math.max(1,baseWidth),height/Math.max(1,baseHeight)));
  return {scale,offsetX:(width-baseWidth*scale)/2,offsetY:(height-baseHeight*scale)/2};
};
const resetPreviewState=()=>{activePreview=null;const holder=document.querySelector('#dialogChart');holder.style.removeProperty('--preview-min-width');holder.style.removeProperty('--preview-min-height');const dialog=document.querySelector('#dialog');dialog._chart?.destroy?.();dialog._chart=null;dialog.classList.remove('open');};
resetPreviewState();
const closePreview=()=>{
  if(!activePreview)return resetPreviewState();
  const{chart,host,placeholder,width,height,view,diagramView}=activePreview;
  activePreview=null;
  placeholder.parentNode?.replaceChild(host,placeholder);
  chart.resize(width,height);
  if(diagramView){if(view)chart.zoomTo(view);else chart.resetZoom();}
  resetPreviewState();
};
const fitPreview=()=>{
  if(!activePreview)return;
  const{chart,item,baseWidth,baseHeight}=activePreview,size=computePreviewSize();
  chart.resize(size.width,size.height);
  const view=previewDiagramView(item,size.width,size.height,baseWidth,baseHeight);
  if(view)chart.zoomTo(view);
  activePreview.diagramView=view;
  document.querySelector('#dialogOutput').textContent=json({state:chart.getState(),explanation:chart.explain(),size,note:'预览按实际可见尺寸适配；关闭后恢复卡片尺寸和原视图。'});
};
function openPreview(item,renderer){
  closePreview();
  const host=document.querySelector(`#chart-${item.id}`),dialog=document.querySelector('#dialog'),article=document.querySelector(`[data-case="${item.id}"]`),chart=instances.get(item.id);
  document.querySelector('#dialogTitle').textContent=`${item.name} · ${renderer}（Esc/关闭返回）`;
  dialog.classList.add('open');
  if(!host||!host.parentNode||!chart){
    document.querySelector('#dialogChart').replaceChildren();
    try{
      const size=computePreviewSize(),view=previewDiagramView(item,size.width,size.height,Number(item.spec.width)||Number(controls.size.value),Number(item.spec.height)||300);
      const preview=createChart({...item.spec,...(view?{view}:{}),...size,container:'#dialogChart',renderer,theme:themeRequest(item.spec.theme),branding:{enabled:article?cardBrandingEnabled(article):globalBrandingEnabled()},interaction:{tooltip:true,hover:true,keyboard:true},editing:{enabled:false},accessibility:{enabled:true}});
      dialog._chart=preview;
      document.querySelector('#dialogOutput').textContent=json({state:preview.getState(),explanation:preview.explain(),size});
    }catch(error){document.querySelector('#dialogOutput').textContent=json(error.details||{message:error.message});}
    return;
  }
  const placeholder=document.createElement('div'),style=getComputedStyle(host),original=chart.getSpec();
  placeholder.style.cssText=`width:${style.width};height:${style.height};border:1px dashed #cbd5e1;border-radius:10px;background:#f8fafc;flex:0 0 auto`;
  host.parentNode.insertBefore(placeholder,host);
  const holder=document.querySelector('#dialogChart'),baseWidth=Number(item.spec.width)||Number(controls.size.value),baseHeight=Number(item.spec.height)||300;
  if(item.spec.diagram?.layout==='manual'){holder.style.setProperty('--preview-min-width',`${baseWidth+2}px`);holder.style.setProperty('--preview-min-height',`${baseHeight+2}px`);}
  holder.replaceChildren(host);
  activePreview={chart,item,host,placeholder,baseWidth,baseHeight,width:original.width,height:original.height,view:original.view||null,diagramView:null};
  try{fitPreview();}catch(error){document.querySelector('#dialogOutput').textContent=json(error.details||{message:error.message});}
}
addEventListener('resize',fitPreview);

function render(){closePreview();clear();const items=selectedCases(),width=Number(controls.size.value),gallery=document.querySelector('#gallery');gallery.style.setProperty('--gallery-viewport-width',`${width}px`);gallery.style.setProperty('--gallery-card-width',`${width+34}px`);items.forEach(item=>{const article=document.createElement('article');article.className='card';article.dataset.case=item.id;article.innerHTML=`<div class="row"><h2 title="点击标题放大预览图表">${item.name}</h2><span class="badge">${item.category}</span></div><div class="chart" id="chart-${item.id}" style="height:${item.spec.height||300}px"></div><div class="row" style="justify-content:space-between"><div class="export-row" id="export-${item.id}"><button type="button" data-export="png">导出 PNG</button><button type="button" data-export="svg">导出 SVG</button><button type="button" data-export="json">导出 JSON</button></div><div class="row" style="gap:10px"><span class="status" data-status>initializing…</span><label style="font:12px system-ui;color:#475569;display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-branding ${cardBrandingEnabled(article)?'checked':''} style="width:auto;accent-color:#2563eb">署名</label><button type="button" data-preview>放大与检查</button></div></div><details><summary>Spec</summary><pre>${json(item.spec)}</pre></details><details><summary>状态与诊断</summary><pre data-output>waiting…</pre></details>`;gallery.appendChild(article);const status=article.querySelector('[data-status]');try{const renderer=controls.renderer.value==='default'?item.renderer:controls.renderer.value;const chart=createChart({...item.spec,chartId:item.id,container:`#chart-${item.id}`,renderer,theme:themeRequest(item.spec.theme),width,height:item.spec.height||300,branding:{enabled:cardBrandingEnabled(article)},preferences:preferenceStore,interaction:{tooltip:true,hover:true,keyboard:true},editing:{enabled:false},accessibility:{enabled:true}});instances.set(item.id,chart);settingsInstances.set(item.id,mountChartSettings(chart));const output=article.querySelector('[data-output]'),refreshOutput=()=>{const state=chart.getState();setStatus(status,state.warnings.length?'warning':'ready',state.warnings.length?`ready · ${state.warnings.length} warnings`:'ready');status.title=state.warnings.map(warning=>`${warning.code}: ${warning.message}`).join('\n');const report={state,explanation:chart.explain()};output.textContent=json(report);if(activePreview?.chart===chart)document.querySelector('#dialogOutput').textContent=json({...report,size:{width:state.width,height:state.height}});};chart.on('preferenceschange',refreshOutput);chart.on('render',refreshOutput);refreshOutput();article.querySelector('h2').addEventListener('click',()=>openPreview(item,renderer));article.querySelector('[data-preview]').onclick=()=>openPreview(item,renderer);article.querySelector('[data-branding]').onchange=event=>{const on=event.target.checked;article.dataset.brandingOverride=on?'on':'off';chart.update({branding:{enabled:on}});refreshOutput();};article.querySelector(`#export-${item.id}`).onclick=event=>{const tgt=event.target.closest('[data-export]');if(!tgt)return;const type=tgt.dataset.export;if(type==='png')chart.downloadPNG?.();else if(type==='svg')chart.downloadSVG?.();else if(type==='json')chart.downloadJSON?.();};}catch(error){setStatus(status,'error',error.message);article.querySelector('[data-output]').textContent=json(error.details||{message:error.message});}});document.querySelector('#count').textContent=`显示 ${items.length} / ${galleryCases.length} · 图表宽度 ${width}px`;}
Object.entries(controls).forEach(([key,control])=>{if(!control)return;const eventName=key==='search'||control.tagName==='INPUT'&&control.type==='text'?'input':'change';control.addEventListener(eventName,event=>{if(key==='globalBranding'){const on=event.target.checked;document.querySelectorAll('#gallery [data-branding]').forEach(checkbox=>{checkbox.checked=on;const article=checkbox.closest('article');if(article){delete article.dataset.brandingOverride;const chart=instances.get(article.dataset.case);if(chart)chart.update({branding:{enabled:on}});}});return;}render();});});document.querySelector('#reset').onclick=()=>{controls.search.value='';controls.category.value='all';controls.renderer.value='default';controls.theme.value='auto';controls.preset.value='auto';controls.palette.value='auto';controls.size.value='560';controls.globalBranding.checked=true;render();};document.querySelector('#dialogClose').onclick=closePreview;document.querySelector('#dialog').onclick=event=>{if(event.target.id==='dialog')closePreview();};addEventListener('keydown',event=>{if(event.key==='Escape')closePreview();});
syncGalleryTheme();
const tbody=document.querySelector('#matrix tbody');capabilities.chartTypes.forEach(type=>{const profile=capabilities.charts[type],supported=Object.entries(profile.features).filter(([,value])=>value==='supported').map(([key])=>key),na=Object.entries(profile.features).filter(([,value])=>value==='not-applicable').map(([key])=>key);const row=document.createElement('tr');row.innerHTML=`<th>${type}</th><td>${profile.family}</td><td>${profile.required.join(', ')}</td><td>${profile.interactions.join(', ')}</td><td class="supported">${supported.join(', ')}</td><td class="not-applicable">${na.join(', ')||'—'}</td>`;tbody.appendChild(row);});document.querySelector('#downloadMatrix').onclick=()=>downloadJSON('ichart-chart-capabilities.json',capabilities.charts);render();
</script></body></html>
