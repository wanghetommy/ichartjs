<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iChart.js 2.0 Complete Gallery</title><link rel="stylesheet" href="./shared.css"></head>
<body><main class="shell"><header class="topbar"><div><h1>完整图表 Gallery</h1><p>16 类公共图表的统一视觉冒烟、能力检查与 Spec/诊断入口。滚轮向上放大、向下缩小；拖动空白区域平移。</p></div><div id="nav"></div></header>
<section class="toolbar" aria-label="Gallery controls"><div class="field"><label for="search">搜索</label><input id="search" placeholder="名称或 type"></div><div class="field"><label for="category">分类</label><select id="category"><option value="all">全部</option><option value="basic">基础</option><option value="statistical">分析</option><option value="project">项目</option><option value="diagram">流程</option></select></div><div class="field"><label for="renderer">Renderer</label><select id="renderer"><option value="default">案例默认</option><option value="svg">SVG</option><option value="canvas">Canvas</option></select></div><div class="field"><label for="theme">Mode</label><select id="theme"><option>auto</option><option>light</option><option>dark</option><option>contrast</option></select></div><div class="field"><label for="preset">Preset</label><select id="preset"><option>auto</option><option>analysis</option><option>dashboard</option><option>report</option><option>presentation</option><option>project</option><option>diagram</option></select></div><div class="field"><label for="palette">Palette</label><select id="palette"><option>auto</option><option>categorical</option><option>sequential</option><option>diverging</option><option>status</option></select></div><div class="field"><label for="size">Viewport</label><select id="size"><option value="560">560</option><option value="390">390</option><option value="768">768</option></select></div><button id="reset" type="button">重置</button><span id="count" class="status">initializing…</span></section>
<section class="grid" id="gallery"></section>
<section class="panel" style="margin-top:18px"><div class="row"><div><h2>逐图表能力矩阵</h2><p class="muted">能力来自公开的 <code>getCapabilities().charts</code>，必须与 runtime 实际行为一致。</p></div><button id="downloadMatrix">下载 JSON</button></div><div class="table-wrap"><table id="matrix"><thead><tr><th>Type</th><th>Family</th><th>Required</th><th>Interactions</th><th>Supported features</th><th>Not applicable</th></tr></thead><tbody></tbody></table></div></section></main>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-label="图表放大预览"><div class="dialog-card"><div class="dialog-head"><strong id="dialogTitle">Preview</strong><button id="dialogClose">关闭（Esc）</button></div><div class="dialog-body"><div id="dialogChart" class="chart"></div><pre id="dialogOutput"></pre></div></div></div>
<script type="module">
import { createChart, getCapabilities } from './runtime.mjs';
import { galleryCases } from './gallery-cases.mjs';
import { downloadJSON, json, pageNav, queryOptions, setStatus } from './playground.mjs';
document.querySelector('#nav').innerHTML=pageNav('project-gallery.html');
const capabilities=getCapabilities(),instances=new Map(),controls={search:document.querySelector('#search'),category:document.querySelector('#category'),renderer:document.querySelector('#renderer'),theme:document.querySelector('#theme'),preset:document.querySelector('#preset'),palette:document.querySelector('#palette'),size:document.querySelector('#size')};
const query=queryOptions(['renderer','theme','preset','palette','size','case']);if(query.values.renderer)controls.renderer.value=query.values.renderer;if(query.values.theme)controls.theme.value=query.values.theme;if(query.values.preset)controls.preset.value=query.values.preset;if(query.values.palette)controls.palette.value=query.values.palette;if(query.values.size)controls.size.value=query.values.size;if(query.values.case)controls.search.value=query.values.case;
const themeRequest=()=>({mode:controls.theme.value,preset:controls.preset.value,palette:controls.palette.value});
function selectedCases(){const term=controls.search.value.trim().toLowerCase(),category=controls.category.value;return galleryCases.filter(item=>(category==='all'||item.category===category)&&(!term||`${item.name} ${item.id} ${item.spec.type}`.toLowerCase().includes(term)));}
function clear(){instances.forEach(chart=>chart.destroy());instances.clear();document.querySelector('#gallery').replaceChildren();}
function render(){clear();const items=selectedCases(),width=Number(controls.size.value);items.forEach(item=>{const article=document.createElement('article');article.className='card';article.dataset.case=item.id;article.innerHTML=`<div class="row"><h2>${item.name}</h2><span class="badge">${item.category}</span></div><div class="chart" id="chart-${item.id}"></div><div class="row"><span class="status" data-status>initializing…</span><button type="button" data-preview>放大与检查</button></div><details><summary>Spec</summary><pre>${json(item.spec)}</pre></details><details><summary>状态与诊断</summary><pre data-output>waiting…</pre></details>`;document.querySelector('#gallery').appendChild(article);const status=article.querySelector('[data-status]');try{const renderer=controls.renderer.value==='default'?item.renderer:controls.renderer.value;const chart=createChart({...item.spec,container:`#chart-${item.id}`,renderer,theme:themeRequest(),width,height:300,interaction:{tooltip:true,hover:true,pan:true,zoom:true,keyboard:true},accessibility:{enabled:true}});instances.set(item.id,chart);const state=chart.getState();setStatus(status,state.warnings.length?'warning':'ready',state.warnings.length?`ready · ${state.warnings.length} warnings`:'ready');article.querySelector('[data-output]').textContent=json({state,explanation:chart.explain()});article.querySelector('[data-preview]').onclick=()=>openPreview(item,renderer);}catch(error){setStatus(status,'error',error.message);article.querySelector('[data-output]').textContent=json(error.details||{message:error.message});}});document.querySelector('#count').textContent=`显示 ${items.length} / ${galleryCases.length}`;}
function openPreview(item,renderer){const dialog=document.querySelector('#dialog');document.querySelector('#dialogTitle').textContent=`${item.name} · ${renderer}`;document.querySelector('#dialogChart').replaceChildren();try{const chart=createChart({...item.spec,container:'#dialogChart',renderer,theme:themeRequest(),width:1040,height:600,interaction:{tooltip:true,hover:true,pan:true,zoom:true,keyboard:true},accessibility:{enabled:true}});dialog._chart=chart;document.querySelector('#dialogOutput').textContent=json({state:chart.getState(),explanation:chart.explain()});dialog.classList.add('open');}catch(error){document.querySelector('#dialogOutput').textContent=json(error.details||{message:error.message});dialog.classList.add('open');}}
function closePreview(){document.querySelector('#dialog')._chart?.destroy();document.querySelector('#dialog')._chart=null;document.querySelector('#dialog').classList.remove('open');}
Object.values(controls).forEach(control=>control.addEventListener(control.tagName==='INPUT'?'input':'change',render));document.querySelector('#reset').onclick=()=>{controls.search.value='';controls.category.value='all';controls.renderer.value='default';controls.theme.value='auto';controls.preset.value='auto';controls.palette.value='auto';controls.size.value='560';render();};document.querySelector('#dialogClose').onclick=closePreview;document.querySelector('#dialog').onclick=event=>{if(event.target.id==='dialog')closePreview();};addEventListener('keydown',event=>{if(event.key==='Escape')closePreview();});
const tbody=document.querySelector('#matrix tbody');capabilities.chartTypes.forEach(type=>{const profile=capabilities.charts[type],supported=Object.entries(profile.features).filter(([,value])=>value==='supported').map(([key])=>key),na=Object.entries(profile.features).filter(([,value])=>value==='not-applicable').map(([key])=>key);const row=document.createElement('tr');row.innerHTML=`<th>${type}</th><td>${profile.family}</td><td>${profile.required.join(', ')}</td><td>${profile.interactions.join(', ')}</td><td class="supported">${supported.join(', ')}</td><td class="not-applicable">${na.join(', ')||'—'}</td>`;tbody.appendChild(row);});document.querySelector('#downloadMatrix').onclick=()=>downloadJSON('ichart-chart-capabilities.json',capabilities.charts);render();
</script></body></html>
