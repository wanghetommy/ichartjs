<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iChart.js Accessibility Lab</title><link rel="stylesheet" href="./shared.css"></head>
<body><main class="shell"><header class="topbar"><div><h1>无障碍实验室</h1><p>覆盖笛卡尔、占比、矩阵、径向、项目和流程图家族的语义、键盘、对比度与响应式验收。</p></div><div id="nav"></div></header>
<section class="toolbar"><div class="field"><label for="renderer">Renderer</label><select id="renderer"><option>svg</option><option>canvas</option></select></div><div class="field"><label for="theme">Theme</label><select id="theme"><option>light</option><option>dark</option><option>contrast</option></select></div><div class="field"><label for="width">宽度</label><select id="width"><option value="560">560</option><option value="390">390</option><option value="768">768</option></select></div><button id="rerender">重新渲染</button><span id="status" class="status">initializing…</span></section>
<section class="panel"><h2>人工验收清单</h2><div class="checklist"><label><input type="checkbox">Tab 可聚焦每个图表，焦点轮廓清晰</label><label><input type="checkbox">屏幕阅读器可读出图表名称和数据项数量</label><label><input type="checkbox">方向键可遍历交互数据项</label><label><input type="checkbox">Contrast 主题下文本和标记可辨识</label><label><input type="checkbox">390 px 下页面不产生整体横向滚动</label><label><input type="checkbox">系统 reduced motion 开启时无必要动画</label></div></section><section class="grid" id="charts" style="margin-top:16px"></section><section class="panel" style="margin-top:16px"><h2>语义检查结果</h2><pre id="output" aria-live="polite"></pre></section></main>
<script type="module">
import { createChart } from './runtime.mjs';import { galleryCases } from './gallery-cases.mjs';import { json, pageNav, setStatus } from './playground.mjs';document.querySelector('#nav').innerHTML=pageNav('accessibility-lab.html');const ids=['line','pie','heatmap','radar','gantt','flow'];let charts=[];
function render(){charts.forEach(chart=>chart.destroy());charts=[];document.querySelector('#charts').replaceChildren();const renderer=document.querySelector('#renderer').value,theme=document.querySelector('#theme').value,width=Number(document.querySelector('#width').value),results=[];ids.forEach(id=>{const item=galleryCases.find(entry=>entry.id===id),article=document.createElement('article');article.className='card';article.innerHTML=`<h2>${item.name}</h2><div class="chart" id="a11y-${id}"></div><span class="status" data-status>initializing…</span>`;document.querySelector('#charts').appendChild(article);try{const chart=createChart({...item.spec,container:`#a11y-${id}`,renderer,theme,width,height:300,interaction:{tooltip:true,keyboard:true},accessibility:{enabled:true,description:`Accessibility test: ${item.name}`}});charts.push(chart);const target=chart.renderer.svg||chart.renderer.canvas,interactive=[];chart.model.scene.walk(node=>{if(node.interactive)interactive.push(node.id);});results.push({type:item.spec.type,renderer,role:target.getAttribute('role'),label:target.getAttribute('aria-label'),tabindex:target.getAttribute('tabindex'),interactiveNodes:interactive.length});setStatus(article.querySelector('[data-status]'),'ready','semantic target ready');}catch(error){results.push({type:item.spec.type,error:error.message});setStatus(article.querySelector('[data-status]'),'error',error.message);}});document.querySelector('#output').textContent=json(results);setStatus(document.querySelector('#status'),results.some(item=>item.error)?'error':'ready',results.some(item=>item.error)?'has errors':`${results.length} families ready`);}
document.querySelector('#rerender').onclick=render;document.querySelector('#renderer').onchange=render;document.querySelector('#theme').onchange=render;document.querySelector('#width').onchange=render;render();
</script></body></html>
