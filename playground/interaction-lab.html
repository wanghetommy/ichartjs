<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iChart.js Interaction Lab</title><link rel="stylesheet" href="./shared.css"></head>
<body><main class="shell"><header class="topbar"><div><h1>交互实验室</h1><p>独立验证 Tooltip、点击选择、滚轮双向缩放、拖拽平移、框选、Crosshair 和键盘遍历。事件与状态显示在右侧。</p></div><div id="nav"></div></header>
<section class="toolbar"><div class="field"><label for="renderer">Renderer</label><select id="renderer"><option>svg</option><option>canvas</option></select></div><button id="zoomIn">放大</button><button id="zoomOut">缩小</button><button id="pan">向右平移</button><button id="reset">重置视图</button><button id="clear">清除选择</button><span id="status" class="status">initializing…</span></section>
<section class="grid"><article class="panel"><h2>交互图表</h2><div id="chart" class="chart"></div><div class="checklist" style="margin-top:12px"><label><input type="checkbox">悬停时显示 Tooltip 和 Crosshair</label><label><input type="checkbox">点击数据点后 selectionchange 更新</label><label><input type="checkbox">滚轮两个方向均可缩放并回到完整范围</label><label><input type="checkbox">拖动空白区域后 view offset 更新</label><label><input type="checkbox">聚焦图表后方向键触发 focuschange</label></div></article><article class="panel"><h2>当前状态</h2><pre id="state"></pre><h2 style="margin-top:14px">事件日志</h2><pre id="events"></pre></article></section></main>
<script type="module">
import { createChart, resolveZoomWindow } from './runtime.mjs';import { json, pageNav, setStatus } from './playground.mjs';document.querySelector('#nav').innerHTML=pageNav('interaction-lab.html');
const rows=Array.from({length:18},(_,index)=>({id:`point-${index}`,name:`D${index+1}`,value:20+Math.round(Math.sin(index/2)*9)+index}));let chart,events=[];const status=document.querySelector('#status');
function payload(event){return{type:event.type||'event',target:event.target?.id||null,dataRef:event.dataRef||event.target?.dataRef||null,coordinate:event.coordinate||null,selectedCount:event.selectedData?.length};}function refresh(){document.querySelector('#state').textContent=json(chart.getState());document.querySelector('#events').textContent=json(events.slice(-16));}function log(type,event){events.push({time:new Date().toISOString().slice(11,23),type,...payload(event)});refresh();}
function mount(){chart?.destroy();document.querySelector('#chart').replaceChildren();events=[];chart=createChart({type:'line',renderer:document.querySelector('#renderer').value,container:'#chart',width:720,height:360,data:rows,title:{text:'Interaction regression series',subtitle:'Wheel, drag, click and keyboard'},labels:{enabled:true},interaction:{tooltip:true,hover:true,click:true,crosshair:true,zoom:true,pan:true,brush:false,keyboard:true},accessibility:{enabled:true,description:'Interactive line chart for testing zoom, pan, selection and keyboard focus.'}});['hover','click','selectionchange','zoomchange','focuschange','dragstart','dragend'].forEach(type=>chart.on(type,event=>log(type,event)));setStatus(status,'ready','ready');refresh();}
document.querySelector('#renderer').onchange=mount;document.querySelector('#zoomIn').onclick=()=>{const current=chart.getState().view||{start:0,end:rows.length};chart.zoomTo(resolveZoomWindow(rows.length,current,.6));refresh();};document.querySelector('#zoomOut').onclick=()=>{const current=chart.getState().view||{start:0,end:rows.length};chart.zoomTo(resolveZoomWindow(rows.length,current,1.8));refresh();};document.querySelector('#pan').onclick=()=>{chart.panBy({x:36,y:0});refresh();};document.querySelector('#reset').onclick=()=>{chart.resetZoom();refresh();};document.querySelector('#clear').onclick=()=>{chart.clearSelection();refresh();};mount();
</script></body></html>
