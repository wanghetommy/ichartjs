<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iChart.js Performance Lab</title><link rel="stylesheet" href="./shared.css"></head>
<body><main class="shell"><header class="topbar"><div><h1>性能与生命周期实验室</h1><p>使用确定性数据测量创建、更新、resize、JSON 导出和销毁；压力测试仅在本页运行。</p></div><div id="nav"></div></header>
<section class="toolbar"><div class="field"><label for="kind">场景</label><select id="kind"><option>line</option><option>heatmap</option><option>gantt</option><option>diagram</option></select></div><div class="field"><label for="count">数据量</label><select id="count"><option value="100">100</option><option value="1000">1,000</option><option value="5000">5,000</option></select></div><div class="field"><label for="renderer">Renderer</label><select id="renderer"><option>canvas</option><option>svg</option></select></div><button class="primary" id="run">运行测量</button><button id="lifecycle">运行 25 次生命周期</button><button id="download">下载结果</button><span id="status" class="status">waiting</span></section>
<section class="grid"><article class="panel"><h2>当前场景</h2><div id="chart" class="chart"></div></article><article class="panel"><h2>测量结果</h2><pre id="output"></pre></article></section><section class="panel" style="margin-top:16px"><h2>本地参考门槛</h2><p>门槛用于发现回归，不代表所有设备：1,000 点 Canvas 首次创建建议低于 250 ms；交互更新建议低于 100 ms；25 次 create/destroy 不应留下 Playground 容器或 Tooltip。</p></section></main>
<script type="module">
import { createChart } from './runtime.mjs';import { downloadJSON, json, measure, pageNav, setStatus } from './playground.mjs';document.querySelector('#nav').innerHTML=pageNav('performance-lab.html');let chart,lastResult=null;
function rows(kind,count){if(kind==='heatmap')return Array.from({length:count},(_,index)=>({id:`cell-${index}`,x:`C${index%50}`,y:`R${Math.floor(index/50)}`,value:(index*37)%101}));if(kind==='gantt')return Array.from({length:Math.min(count,1000)},(_,index)=>({id:`task-${index}`,name:`Task ${index}`,start:`2026-09-${String(index%27+1).padStart(2,'0')}`,end:`2026-10-${String(index%27+1).padStart(2,'0')}`,progress:(index%100)/100}));if(kind==='diagram')return Array.from({length:Math.min(count,300)},(_,index)=>({id:`node-${index}`,label:`Node ${index}`,position:{x:40+(index%12)*100,y:40+Math.floor(index/12)*60}}));return Array.from({length:count},(_,index)=>({id:`point-${index}`,name:`P${index}`,value:50+Math.sin(index/12)*30+(index%7)}));}
function spec(kind,count,renderer){const data=rows(kind,count),base={renderer,width:760,height:360,title:{text:`${kind} · ${data.length}`},accessibility:{enabled:true}};if(kind==='heatmap')return{...base,type:'heatmap',data,encoding:{x:{field:'x'},y:{field:'y'},color:{field:'value'}}};if(kind==='gantt')return{...base,type:'gantt',data};if(kind==='diagram')return{...base,type:'flow',nodes:data,edges:data.slice(1).map((node,index)=>({from:data[index].id,to:node.id})),diagram:{layout:'manual',routing:'straight'}};return{...base,type:'line',data};}
function run(){chart?.destroy();document.querySelector('#chart').replaceChildren();const kind=document.querySelector('#kind').value,count=Number(document.querySelector('#count').value),renderer=document.querySelector('#renderer').value,input=spec(kind,count,renderer),created=measure('create',()=>createChart({...input,container:'#chart'}));chart=created.value;const resized=measure('resize',()=>chart.resize(720,360)),exported=measure('json-export',()=>chart.export({type:'json'})),memory=performance.memory?{usedJSHeapSize:performance.memory.usedJSHeapSize,totalJSHeapSize:performance.memory.totalJSHeapSize}:null;lastResult={timestamp:new Date().toISOString(),kind,count:kind==='diagram'?input.nodes.length:input.data.length,renderer,measurements:[{label:created.label,durationMs:created.durationMs},{label:resized.label,durationMs:resized.durationMs},{label:exported.label,durationMs:exported.durationMs,bytes:exported.value.length}],sceneNodes:(()=>{let value=0;chart.model.scene.walk(()=>value++);return value;})(),memory};document.querySelector('#output').textContent=json(lastResult);setStatus(document.querySelector('#status'),created.durationMs<250||count<1000?'ready':'warning',`create ${created.durationMs} ms`);}
document.querySelector('#run').onclick=run;document.querySelector('#lifecycle').onclick=()=>{chart?.destroy();chart=null;document.querySelector('#chart').replaceChildren();const input=spec('line',100,document.querySelector('#renderer').value),result=measure('25-create-destroy',()=>{for(let index=0;index<25;index++){const instance=createChart({...input,container:'#chart'});instance.destroy();document.querySelector('#chart').replaceChildren();}});lastResult={timestamp:new Date().toISOString(),lifecycleCycles:25,durationMs:result.durationMs,remainingChildren:document.querySelector('#chart').childElementCount,remainingTooltips:document.querySelectorAll('.ichart-v2-tooltip').length};document.querySelector('#output').textContent=json(lastResult);setStatus(document.querySelector('#status'),lastResult.remainingChildren||lastResult.remainingTooltips?'error':'ready',lastResult.remainingChildren||lastResult.remainingTooltips?'lifecycle leak visible':'25 cycles clean');};document.querySelector('#download').onclick=()=>lastResult&&downloadJSON('ichart-performance-result.json',lastResult);run();
</script></body></html>
