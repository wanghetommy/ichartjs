<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iChart.js Performance Lab</title><link rel="stylesheet" href="./shared.css"><style>#chart.multi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;height:auto}.lab-host{min-width:0;overflow:hidden}#chart svg,#chart canvas{max-width:100%}@media(max-width:768px){#chart.multi{grid-template-columns:1fr}}</style></head>
<body><main class="shell"><header class="topbar"><div><h1>性能与宿主生命周期实验室</h1><p>区分同步 API 耗时和下一次呈现机会；压力测试仅在本页运行。</p></div><div id="nav"></div></header>
<section class="toolbar"><div class="field"><label for="kind">场景</label><select id="kind"><option>line</option><option>heatmap</option><option>gantt</option><option>diagram</option><option value="dashboard">dashboard · 3 charts</option></select></div><div class="field"><label for="count">每图数据量</label><select id="count"><option value="100">100</option><option value="1000">1,000</option><option value="5000">5,000</option><option value="10000">10,000</option><option value="50000">50,000</option></select></div><div class="field"><label for="renderer">Renderer</label><select id="renderer"><option>canvas</option><option>svg</option></select></div><button class="primary" id="run">运行测量</button><button id="lifecycle">运行 25 次生命周期</button><button id="download">下载结果</button><span id="status" class="status">waiting</span></section>
<section class="grid"><article class="panel"><h2>当前场景</h2><div id="chart" class="chart"></div></article><article class="panel"><h2>测量结果</h2><pre id="output"></pre></article></section>
<section class="panel" style="margin-top:16px"><h2>如何解读</h2><p>durationMs 是同步 API 时间。presentationOpportunityMs 包含 API 和两次 requestAnimationFrame 的等待：只是浏览器获得呈现机会，不是精确 GPU 绘制时间、FPS 或移动设备保证。数据量和实际 Renderer 一并记录。</p><p>生命周期检查在每次 destroy 后直接统计残留，不手动清空画布掩盖问题；零残留 DOM 不等于完整内存泄漏证明。原有自动化性能预算保持不变。</p></section></main>
<script type="module" src="./performance-lab.mjs"></script></body></html>
