<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iChart.js Agent Workbench</title><link rel="stylesheet" href="./shared.css"></head>
<body><main class="shell"><header class="topbar"><div><h1>Agent 图表工作台</h1><p>通过公开 API 完成数据检查、意图规划、Spec 验证、渲染、解释和导出；不读取内部实现。</p></div><div id="nav"></div></header>
<section class="toolbar"><div class="field"><label for="intent">分析意图</label><select id="intent"></select></div><div class="field"><label for="renderer">Renderer</label><select id="renderer"><option>svg</option><option>canvas</option></select></div><button class="primary" id="run">检查、规划并渲染</button><button id="invalid">载入歧义案例</button><button id="download">下载 Agent 输出</button><span id="status" class="status">waiting</span></section>
<section class="grid"><article class="panel"><h2>输入数据（JSON）</h2><textarea id="data"></textarea></article><article class="panel"><h2>生成/编辑 Spec（JSON）</h2><textarea id="spec"></textarea></article></section>
<section class="grid" style="margin-top:16px"><article class="panel"><h2>渲染结果</h2><div id="chart" class="chart"></div></article><article class="panel"><h2>数据检查</h2><pre id="inspection"></pre></article><article class="panel"><h2>Agent 规划</h2><pre id="plan"></pre></article><article class="panel"><h2>验证、解释与自检</h2><pre id="result"></pre></article></section></main>
<script type="module">
import { createChart, getCapabilities, getChartCapability, inspectData, planChart, validateSpec } from './runtime.mjs';
import { downloadJSON, json, pageNav, setStatus } from './playground.mjs';
document.querySelector('#nav').innerHTML=pageNav('agent-workbench.html');
const defaultData=[{id:'jan',month:'Jan',revenue:120,cost:82},{id:'feb',month:'Feb',revenue:148,cost:91},{id:'mar',month:'Mar',revenue:136,cost:null},{id:'apr',month:'Apr',revenue:176,cost:105}];
const intent=document.querySelector('#intent'),capabilities=getCapabilities();capabilities.intents.forEach(value=>intent.add(new Option(value,value)));intent.value='trend';document.querySelector('#data').value=json(defaultData);let chart=null,lastOutput=null;
function generatedSpec(data,plan){const report=plan.data,dimension=report.dimensions[0]||'name',measure=report.measures[0]||'value',secondary=report.measures[1];const base={type:plan.primary,renderer:document.querySelector('#renderer').value,width:640,height:360,data,title:{text:`Agent plan · ${plan.intent}`,subtitle:`confidence ${plan.confidence}`},interaction:{tooltip:true,hover:true,keyboard:true},accessibility:{enabled:true}};if(['line','area','bar','column'].includes(plan.primary))base.encoding={x:{field:dimension,type:report.temporalFields.includes(dimension)?'temporal':'category'},y:secondary?[{field:measure},{field:secondary}]:{field:measure}};else if(['pie','funnel','gauge'].includes(plan.primary))base.encoding={category:{field:dimension},value:{field:measure}};else if(plan.primary==='scatter')base.encoding={x:{field:measure,type:'quantitative'},y:{field:secondary||measure,type:'quantitative'}};else if(plan.primary==='heatmap')base.encoding={x:{field:report.dimensions[0]||'x'},y:{field:report.dimensions[1]||'y'},color:{field:measure}};else if(plan.primary==='radar')base.indicators=report.measures.map(field=>{const info=report.fields.find(item=>item.name===field);return{name:field,field,min:info?.min??0,max:info?.max??1};});return base;}
function run(){chart?.destroy();chart=null;document.querySelector('#chart').replaceChildren();try{const data=JSON.parse(document.querySelector('#data').value),inspection=inspectData(data),plan=planChart(data,{intent:intent.value,renderer:document.querySelector('#renderer').value});document.querySelector('#inspection').textContent=json(inspection);document.querySelector('#plan').textContent=json(plan);let spec;try{spec=JSON.parse(document.querySelector('#spec').value||'null');}catch{spec=null;}if(!spec||spec.__generatedIntent!==intent.value){spec=generatedSpec(data,plan);spec.__generatedIntent=intent.value;document.querySelector('#spec').value=json(spec);}delete spec.__generatedIntent;const validation=validateSpec(spec);if(!validation.valid){setStatus(document.querySelector('#status'),'error',`${validation.errors.length} errors`);lastOutput={inspection,plan,validation};document.querySelector('#result').textContent=json(lastOutput);return;}chart=createChart({...spec,container:'#chart'});const explanation=chart.explain(),selfCheck={capabilityFound:Boolean(getChartCapability(spec.type)),specValid:validation.valid,recordIdsPreserved:explanation.lineage.recordIds.length===inspection.rows,visibleWarnings:chart.getState().warnings};lastOutput={inspection,plan,validation,capability:getChartCapability(spec.type),explanation,state:chart.getState(),selfCheck};document.querySelector('#result').textContent=json(lastOutput);setStatus(document.querySelector('#status'),lastOutput.state.warnings.length?'warning':'ready',lastOutput.state.warnings.length?`ready · ${lastOutput.state.warnings.length} warnings`:'ready');}catch(error){lastOutput={error:error.message,details:error.details||[]};document.querySelector('#result').textContent=json(lastOutput);setStatus(document.querySelector('#status'),'error',error.message);}}
document.querySelector('#run').onclick=()=>{const current=JSON.parse(document.querySelector('#data').value);const plan=planChart(current,{intent:intent.value});const spec=generatedSpec(current,plan);spec.__generatedIntent=intent.value;document.querySelector('#spec').value=json(spec);run();};document.querySelector('#invalid').onclick=()=>{intent.value='part-to-whole';document.querySelector('#data').value=json(Array.from({length:12},(_,index)=>({id:`item-${index}`,category:`Category ${index+1}`,value:index===3?null:index+1})));document.querySelector('#spec').value='';run();};document.querySelector('#download').onclick=()=>lastOutput&&downloadJSON('ichart-agent-result.json',lastOutput);run();
</script></body></html>
