<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iChart.js Freeform Board</title><link rel="stylesheet" href="./shared.css"><style>#board{min-height:240px;border:1px solid #dbe2ea;border-radius:14px;overflow:auto;background:#fff}#board svg{display:block;max-width:100%;height:auto}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.meta pre{white-space:pre-wrap;word-break:break-word}</style></head>
<body><main class="shell"><header class="topbar"><div><h1>Freeform Board</h1></div><div id="nav"></div></header><section id="simple-construction" class="panel"></section><section id="board" aria-label="Freeform board preview"></section><details id="developer-tools" class="panel"><summary>Developer tools</summary><section class="toolbar"><button class="primary" id="render">Render full composition</button><button id="svg">Export SVG</button><button id="json">Export JSON</button><span id="status" class="status">waiting</span></section><section class="meta" style="margin-top:16px"><article class="panel"><h2>State</h2><pre id="state"></pre></article><article class="panel"><h2>Explanation</h2><pre id="explain"></pre></article><article class="panel"><h2>Contract</h2><pre id="contract"></pre></article></section></details></main>
<script type="module">
import { createBoard, getCapabilities } from './runtime.mjs';
import { mountBoardBuilder } from './board-builder.mjs';
import { mountSimpleConstruction, getConstructionExample } from './simple-construction.mjs';
import { pageNav, setStatus, json } from './playground.mjs';
import logoSpec from '../agent-recipes/logo-spec.json' with { type: 'json' };
import { createBoardComposition } from './board-composition.mjs';
document.querySelector('#nav').innerHTML=pageNav('canvas-board.html');
const spec=createBoardComposition(logoSpec);
const controls=document.createElement('details');
controls.id='board-builder';controls.className='panel';controls.style.marginBottom='16px';
const builderStyle=document.createElement('style');
builderStyle.textContent='#board-preview svg,#board-preview canvas,#board canvas{display:block;max-width:100%;height:auto!important}';
document.head.append(builderStyle);
controls.innerHTML=`<summary>Incremental Board · Agent preview and confirmed turns</summary><p>Start explicitly, then add charts, text and shapes step by step. Existing positions stay fixed; no automatic reflow.</p><div class="toolbar"><button id="board-start">Start incremental demo</button><select id="board-template" aria-label="Board command template"></select><button id="board-preview-command">Preview command</button><button class="primary" id="board-apply" disabled>Confirm and apply</button><button id="board-undo">Undo</button><button id="board-redo">Redo</button><button id="board-save">Save BoardSpec</button><button id="board-reload">Reload BoardSpec</button></div><label for="board-command">Structured Board command (host Agent interprets natural language)</label><textarea id="board-command" rows="8" style="width:100%;box-sizing:border-box;font-family:monospace"></textarea><details><summary>Preview diagnostics and result</summary><pre id="board-builder-output" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></details><details open><summary>Uncommitted visual preview · images are not loaded</summary><div id="board-preview" style="max-height:320px;overflow:auto"></div></details>`;
document.querySelector('#developer-tools > .meta').before(controls);
const renderer=new URLSearchParams(location.search).get('renderer');
if(['svg','canvas','auto'].includes(renderer))spec.renderer=renderer;
let board,builder,unsubscribe,simple;
function refresh(message='ready'){if(!board)return;builder?.synchronize();simple?.synchronize();document.querySelector('#state').textContent=json(board.getState());document.querySelector('#explain').textContent=json(board.explain());document.querySelector('#contract').textContent=json(getCapabilities().canvasComposition);setStatus(document.querySelector('#status'),'ready',message);}
function replaceBoard(input){const next=createBoard(input);builder?.clearPreview();unsubscribe?.();board?.destroy();board=next.mount('#board');unsubscribe=board.subscribe(event=>{if(event.type!=='assets')builder?.clearPreview();refresh();});board.ready().then(()=>{if(board===next)refresh();}).catch(error=>setStatus(document.querySelector('#status'),'error',error.message));refresh();}
function render(){try{replaceBoard(spec);}catch(error){document.querySelector('#state').textContent=json({message:error.message,details:error.details||[]});setStatus(document.querySelector('#status'),'error',error.message);}}
document.querySelector('#render').onclick=render;document.querySelector('#svg').onclick=()=>board&&download('board.svg',board.export({type:'svg'}),'image/svg+xml');document.querySelector('#json').onclick=()=>board&&download('board.json',board.export({type:'json',as:'string'}),'application/json');function download(name,value,type){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([value],{type}));link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),0);}
if(['advanced','composition'].includes(new URLSearchParams(location.search).get('scenario')))render();else replaceBoard(getConstructionExample('board',spec).spec);
try{builder=await mountBoardBuilder({getBoard:()=>board,replaceBoard,refresh});}catch(error){setStatus(document.querySelector('#status'),'error',error.message);}
simple=mountSimpleConstruction({kind:'board',composition:spec,getRuntime:()=>board,reset:input=>replaceBoard({...input,renderer:spec.renderer}),refresh});
</script></body></html>
