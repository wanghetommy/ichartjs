<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iChart.js 2.0 Agent Editing Preview</title>
<style>body{margin:0;padding:24px;background:#f1f5f9;color:#0f172a;font:14px system-ui,sans-serif}main{max-width:1000px;margin:auto}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:16px 0}#chart{cursor:grab;touch-action:none}#chart:active{cursor:grabbing}button{border:0;border-radius:6px;padding:9px 14px;background:#2563eb;color:#fff;cursor:pointer}button.secondary{background:#475569}pre{overflow:auto;background:#f8fafc;padding:12px;font-size:12px;line-height:1.45}.ok{color:#15803d}.warn{color:#b45309}</style>
</head>
<body><main><h1>Agent Data Contract &amp; Editing</h1><p>Iteration 4A–4E demo: schema validation, deterministic preview, guarded commit, audit metadata, undo/redo. This page only changes local chart state and does not persist external business data. <strong>拖动图表空白区域</strong>可平移时间轴；业务日期通过预览和确认提交修改。</p><section class="panel"><h2>Gantt data</h2><div id="chart"></div><button id="preview">1. Preview: delay Build by 2 days</button> <button id="commit" disabled>2. Confirm &amp; commit</button> <button class="secondary" id="undo" disabled>Undo</button> <button class="secondary" id="redo" disabled>Redo</button> <button class="secondary" id="reset">Reset</button></section><section class="panel"><h2>Result</h2><div id="status">No preview yet.</div><pre id="output"></pre></section></main>
<script type="module">
import { createChart, getBusinessSchema } from '../src/index.mjs';
const values = [{ id: 'design', name: 'Design', start: '2026-09-01', end: '2026-09-05', progress: 100, status: 'done', dependencies: [] }, { id: 'build', name: 'Build', start: '2026-09-06', end: '2026-09-15', progress: 60, status: 'active', dependencies: ['design'] }, { id: 'qa', name: 'QA', start: '2026-09-16', end: '2026-09-19', progress: 0, status: 'todo', dependencies: ['build'] }];
const schema = getBusinessSchema('project-task');
let chart = createChart({ container: '#chart', type: 'gantt', renderer: 'svg', width: 860, height: 280, data: { values, schema }, interaction: { tooltip: true, drag: true, pan: true, zoom: true }, editing: { enabled: true, mode: 'command', requireConfirmation: true } });
const output = document.querySelector('#output'), status = document.querySelector('#status'), commit = document.querySelector('#commit'), undo = document.querySelector('#undo'), redo = document.querySelector('#redo');
const command = { type: 'edit', reason: 'Schedule delay', operations: [{ op: 'shiftTask', taskId: 'build', days: 2, shiftDependents: true }] };
let preview;
chart.on('zoomchange', ({ view }) => { const build = chart.toDataTable().find(row => row.id === 'build'); status.className = 'ok'; status.textContent = `拖动已生效，时间轴已平移。${build ? ` Build: ${build.start} → ${build.end}。` : ''} offsetX: ${view.offsetX || 0}。`; });
chart.on('dragstart', () => { status.className = 'ok'; status.textContent = '正在拖动时间轴…'; });
const refresh = (result, message) => { status.className = result.valid ? 'ok' : 'warn'; const build = chart.toDataTable().find(row => row.id === 'build'); status.textContent = build ? `${message} Build: ${build.start} → ${build.end}；revision: ${chart.getState().revision}.` : message; output.textContent = JSON.stringify(result, null, 2); undo.disabled = chart.getState().history.undo === 0; redo.disabled = chart.getState().history.redo === 0; };
document.querySelector('#preview').onclick = () => { preview = chart.previewEdit(command); commit.disabled = !preview.valid; refresh(preview, preview.valid ? `${preview.changes.length} changes previewed; confirmation required: ${preview.requiresConfirmation}. Source data is unchanged.` : preview.errors.map(error => error.message).join(' ')); };
commit.onclick = () => { const result = chart.applyEdit(command, { preview, confirmed: true, actor: 'demo-agent', source: 'playground' }); preview = null; commit.disabled = true; refresh(result, result.valid ? `Committed locally at revision ${result.revision}.` : result.errors.map(error => error.message).join(' ')); };
undo.onclick = () => refresh(chart.undo(), 'Undo applied locally.');
redo.onclick = () => refresh(chart.redo(), 'Redo applied locally.');
document.querySelector('#reset').onclick = () => { preview = null; commit.disabled = true; chart.update({ data: { values, schema } }); output.textContent = ''; status.textContent = 'No preview yet.'; status.className = ''; undo.disabled = true; redo.disabled = true; };
</script></body></html>
