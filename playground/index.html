<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iChart.js Playground</title><link rel="stylesheet" href="./shared.css"></head>
<body><main class="shell"><header class="topbar"><div><h1>iChart.js 2.0 Playground</h1><p>统一的能力浏览、Agent 集成与发布验收入口。所有页面均可独立打开，错误和诊断应直接显示在页面中。</p></div><div><div id="nav"></div><div id="version" class="badge">loading…</div></div></header>
<section><h2>推荐演示</h2><div class="grid" id="featured" aria-label="Recommended Playground demos"></div></section>
<details class="panel" style="margin-top:16px"><summary><strong>专项验收与发布素材</strong><span class="muted">　按需加载、基础能力、交互、无障碍、性能和 GIF 素材</span></summary><div class="grid" id="validation" style="margin-top:16px" aria-label="Playground validation pages"></div></details>
<details class="panel" style="margin-top:16px" id="footprint-panel"><summary><strong>体积与按需集成</strong><span class="muted">　Profile 入口、运行时包体积与 Agent 文档资源</span></summary><div id="footprint-status" class="status" style="margin-top:12px">loading…</div><div id="footprint-content" style="margin-top:12px"></div></details>
<section class="panel" style="margin-top:16px"><h2>启动与验收</h2><p><code>npm run playground</code></p><p class="muted">每个页面状态通过 HTTP HEAD 检查；“ready”仅表示页面可访问，不代替页面内验收。</p></section></main>
<script type="module">
import { getCapabilities } from './runtime.mjs';
import { pageNav, playgroundPages, runtimeVersion, setStatus } from './playground.mjs';
document.querySelector('#nav').innerHTML=pageNav('index.html');
const capabilities=getCapabilities();document.querySelector('#version').textContent=`${runtimeVersion} · ${capabilities.chartTypes.length} charts`;
const renderPages=(group,target)=>{playgroundPages.filter(page=>page.homeGroup===group).forEach(({href:pageHref,label,description,kind})=>{const article=document.createElement('article');article.className='card';article.innerHTML=`<div class="row"><span class="badge">${kind}</span><span class="status" data-status>checking…</span></div><h2><a href="./${pageHref}">${label}</a></h2><p>${description}</p><code>http://localhost:3000/playground/${pageHref}</code>`;target.appendChild(article);fetch(`./${pageHref}`,{method:'HEAD'}).then(response=>setStatus(article.querySelector('[data-status]'),response.ok?'ready':'error',response.ok?'ready':`HTTP ${response.status}`)).catch(error=>setStatus(article.querySelector('[data-status]'),'error',error.message));});};
renderPages('featured',document.querySelector('#featured'));renderPages('validation',document.querySelector('#validation'));
const formatBytes = value => { const units=['B','KiB','MiB']; let amount=Number(value)||0,index=0; while(amount>=1024&&index<units.length-1){amount/=1024;index+=1;} return `${amount>=100?amount.toFixed(0):amount>=10?amount.toFixed(1):amount.toFixed(2)} ${units[index]}`; };
const escapeHtml = value => String(value).replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const profileImports={standard:'@taylorwong/ichartjs/standard',project:'@taylorwong/ichartjs/project',diagram:'@taylorwong/ichartjs/diagram',board:'@taylorwong/ichartjs/board'};
async function renderFootprint(){
  const status=document.querySelector('#footprint-status'),target=document.querySelector('#footprint-content');
  try{
    const response=await fetch('./footprint.json',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();
    const entries=[['root',{rawBytes:data.moduleRawBytes,gzipBytes:data.moduleGzipBytes} ],...Object.entries(data.profiles)];
    const profiles=entries.map(([name,stats])=>{const saving=name==='root'?null:100-(stats.gzipBytes/data.moduleGzipBytes*100);const importName=name==='root'?'@taylorwong/ichartjs':profileImports[name];return `<tr><th scope="row"><code>${name}</code></th><td>${formatBytes(stats.rawBytes)}</td><td>${formatBytes(stats.gzipBytes)}</td><td>${saving===null?'—':`${saving.toFixed(0)}%`}</td><td><code>import { createChart } from '${importName}'</code></td></tr>`;}).join('');
    const resources=Object.entries(data.resources.groups).sort((left,right)=>right[1].bytes-left[1].bytes).map(([name,stats])=>`<tr><th scope="row">${escapeHtml(name)}</th><td>${stats.files}</td><td>${formatBytes(stats.bytes)}</td></tr>`).join('');
    target.innerHTML=`<div class="grid"><article class="card"><div class="metric">${formatBytes(data.moduleGzipBytes)}</div><div class="muted">Root gzip estimate</div></article><article class="card"><div class="metric">${formatBytes(data.packageBytes)}</div><div class="muted">npm tarball</div></article><article class="card"><div class="metric">${formatBytes(data.unpackedBytes)}</div><div class="muted">Unpacked package</div></article></div><h3 style="margin-top:16px">Runtime entry estimates</h3><p class="muted">Source module graph + gzip estimate; not a production bundler result. Profile graphs share dependencies and must not be added together.</p><div class="table-wrap"><table><caption class="hidden">Runtime profile sizes</caption><thead><tr><th scope="col">Entry</th><th scope="col">Source graph</th><th scope="col">Gzip estimate</th><th scope="col">vs root</th><th scope="col">Import</th></tr></thead><tbody>${profiles}</tbody></table></div><h3 style="margin-top:16px">Packaged Agent resources</h3><p class="muted">Documentation, Skill, Recipes, manifests and TypeScript declarations are not automatically loaded by browser runtime.</p><div class="table-wrap"><table><caption class="hidden">Packaged resource sizes</caption><thead><tr><th scope="col">Resource</th><th scope="col">Files</th><th scope="col">Size</th></tr></thead><tbody>${resources}</tbody></table></div><p class="muted" style="margin-top:12px">Measured package: ${escapeHtml(data.packageVersion)} · ${data.entryCount} files. Generated from the repository package dry run.</p>`;
    setStatus(status,'ready',`measured ${data.packageVersion}`);
  }catch(error){target.innerHTML='<p class="muted">体积统计暂不可用，不影响 Playground 使用。</p>';setStatus(status,'warning',error.message);}
}
renderFootprint();
</script></body></html>
